<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OmniRoute Chat</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --txt:#e8eaf0; --mut:#9aa0ae; --acc:#f5a524; --acc-d:#c77f0a;
    --ubub:#2b3a55; --abub:#1e222b; --err:#5a2323; --ok:#2e7d4f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0; background:var(--bg); color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex; flex-direction:column; height:100dvh;}
  header{display:flex; align-items:center; gap:8px; padding:10px 12px;
    background:var(--panel); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:5;}
  header .logo{width:28px;height:28px;border-radius:8px;flex:none;
    background:linear-gradient(135deg,var(--acc),#ff7847);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#1a1206;font-size:15px;}
  header h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;}
  header h1 small{display:block;font-size:10px;color:var(--mut);font-weight:400;}
  select,button,input,textarea{font:inherit;color:var(--txt);}
  select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    padding:7px 8px;font-size:13px;max-width:38vw;}
  .iconbtn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    padding:7px 10px;font-size:14px;cursor:pointer;}
  .iconbtn:active{transform:scale(.96);}
  #status{font-size:12px;color:var(--mut);text-align:center;padding:6px 12px;
    min-height:28px;border-bottom:1px solid var(--line);background:var(--panel);}
  #status.busy{color:var(--acc);}
  #status.err{color:#ff9a9a;}
  #status.ok{color:#7fd79a;}
  #chat{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;
    flex-direction:column;gap:10px;}
  .msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:15px;
    line-height:1.5;word-wrap:break-word;white-space:pre-wrap;}
  .msg.user{align-self:flex-end;background:var(--ubub);border-bottom-right-radius:4px;}
  .msg.ai{align-self:flex-start;background:var(--abub);border:1px solid var(--line);
    border-bottom-left-radius:4px;}
  .msg.err{align-self:stretch;max-width:100%;background:var(--err);
    border:1px solid #7a3030;font-size:13px;}
  .msg pre{background:#0b0d11;border:1px solid var(--line);border-radius:8px;
    padding:8px;overflow-x:auto;font-size:13px;margin:8px 0;}
  .msg code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em;
    background:#0b0d11;padding:1px 5px;border-radius:5px;}
  .msg pre code{background:none;padding:0;}
  .typing{display:inline-block;}
  .typing i{display:inline-block;width:6px;height:6px;margin-right:3px;
    border-radius:50%;background:var(--mut);animation:bl 1s infinite;}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
  #composer{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:var(--panel);border-top:1px solid var(--line);}
  #in{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:12px;
    padding:11px 12px;font-size:15px;resize:none;max-height:120px;outline:none;}
  #in:focus{border-color:var(--acc);}
  #in:disabled{opacity:.5;}
  #send{background:var(--acc);color:#1a1206;border:none;border-radius:12px;
    padding:0 18px;font-size:16px;font-weight:700;cursor:pointer;min-height:46px;}
  #send:disabled{opacity:.45;cursor:default;}
  #send:active:not(:disabled){transform:scale(.96);}
  #keyrow{display:none;gap:8px;align-items:center;font-size:12px;color:var(--mut);
    padding:8px 12px;}
  #keyrow.show{display:flex;}
  #keyrow button{background:none;border:1px solid var(--line);border-radius:6px;
    color:var(--mut);font-size:11px;padding:3px 8px;cursor:pointer;}
  #keymodal{position:fixed;inset:0;background:rgba(5,6,9,.82);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px;}
  #keymodal.show{display:flex;}
  #keymodal .card{background:var(--panel);border:1px solid var(--acc-d);
    border-radius:16px;padding:22px;width:100%;max-width:380px;}
  #keymodal h2{font-size:17px;margin:0 0 8px;}
  #keymodal p{font-size:13px;color:var(--mut);margin:0 0 12px;line-height:1.55;}
  #keymodal p b{color:var(--txt);}
  #mkey{width:100%;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;padding:12px;font-size:15px;margin-bottom:10px;}
  #mkey:focus{border-color:var(--acc);outline:none;}
  #msave{width:100%;background:var(--acc);color:#1a1206;border:none;
    border-radius:10px;padding:13px;font-size:16px;font-weight:700;cursor:pointer;}
  #msave:disabled{opacity:.5;}
  #merr{display:none;font-size:12px;color:#ff9a9a;margin-top:8px;line-height:1.5;}
</style>
</head>
<body>
<header>
  <div class="logo">O</div>
  <h1>OmniRoute Chat<small>your private AI gateway</small></h1>
  <select id="model" title="Model">
    <option value="auto" selected>auto (recommended)</option>
    <option value="ddgw/claude-haiku-4-5">claude-haiku-4-5</option>
    <option value="ddgw/gpt-5.6-luna">gpt-5.6-luna</option>
    <option value="ddgw/gpt-5.4-mini">gpt-5.4-mini</option>
    <option value="ddgw/mistral-small-2603">mistral-small-2603</option>
    <option value="__custom">custom…</option>
  </select>
  <button class="iconbtn" id="newchat" title="New chat">＋</button>
</header>
<div id="status"></div>
<div id="keyrow"><span id="keystate">API key saved on this device</span><button id="changekey">change</button><button id="forgetkey">forget</button></div>
<div id="chat"></div>
<div id="composer">
  <textarea id="in" rows="1" placeholder="Message…" disabled></textarea>
  <button id="send" disabled>➤</button>
</div>

<div id="keymodal">
  <div class="card">
    <h2>🔑 One quick step</h2>
    <p>Paste your <b>manas-main</b> API key to connect this chat to your OmniRoute server. It's saved <b>only in this browser</b> — never inside the page.</p>
    <input id="mkey" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false">
    <button id="msave">Connect</button>
    <div id="merr"></div>
  </div>
</div>

<script>
(function(){
"use strict";
const BASE = "https://omniroute-4lx0.onrender.com/v1";
const $ = id => document.getElementById(id);
const chat=$("chat"), status=$("status"), input=$("in"), send=$("send"),
      modelSel=$("model"), keymodal=$("keymodal"), mkey=$("mkey"),
      msave=$("msave"), merr=$("merr"), keyrow=$("keyrow"), keystate=$("keystate");
let history = [], busy = false, serverReady = false, lastUser = "";

const getKey = () => localStorage.getItem("omni_key") || "";
function setStatus(t, cls){ status.textContent = t; status.className = cls || ""; }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function refreshKeyUI(){
  const has = !!getKey();
  keymodal.classList.toggle("show", !has);
  keyrow.classList.toggle("show", has);
  input.disabled = !has;
  send.disabled = !has || busy;
  if(!has) setStatus("Add your API key to begin.");
}

function showKeyError(t){ merr.style.display = "block"; merr.textContent = t; }
msave.onclick = async () => {
  const v = mkey.value.trim();
  if(!v){ mkey.focus(); return; }
  merr.style.display = "none";
  msave.disabled = true; msave.textContent = "Checking…";
  try{
    await apiGet("/models", v);
    localStorage.setItem("omni_key", v);
    mkey.value = "";
    refreshKeyUI();
    setStatus("Key accepted.", "ok");
    wakeServer();
  }catch(e){
    showKeyError("Couldn't connect: " + e.message + " — check the key and try again.");
  }
  msave.disabled = false; msave.textContent = "Connect";
};
mkey.addEventListener("keydown", e=>{ if(e.key === "Enter") msave.onclick(); });
$("changekey").onclick = () => { keymodal.classList.add("show"); setTimeout(()=>mkey.focus(), 50); };
$("forgetkey").onclick = () => {
  if(confirm("Forget the saved API key on this device?")){
    localStorage.removeItem("omni_key"); serverReady = false; refreshKeyUI();
  }
};

modelSel.onchange = () => {
  if(modelSel.value === "__custom"){
    const c = prompt("Model id (e.g. ddgw/gpt-5.4-mini):", "ddgw/gpt-5.4-mini");
    if(c && c.trim()){
      const o = document.createElement("option");
      o.value = c.trim(); o.textContent = c.trim(); o.selected = true;
      modelSel.insertBefore(o, modelSel.lastChild);
    } else modelSel.value = "auto";
  }
};
$("newchat").onclick = () => { history = []; chat.innerHTML = ""; setStatus(""); };

function md(s){
  let out = esc(s), codes = [];
  out = out.replace(/```(\w*)\n([\s\S]*?)```/g, (m,l,c)=>{
    codes.push("<pre><code>"+c.replace(/\n$/,"")+"</code></pre>");
    return "%%CB"+(codes.length-1)+"%%";
  });
  out = out.replace(/`([^`\n]+)`/g, "<code>$1</code>")
           .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
           .replace(/(^|\n)#{1,4}\s?([^\n]+)/g, "$1<b>$2</b>")
           .replace(/(^|\n)[-*]\s/g, "$1• ");
  codes.forEach((c,i)=>{ out = out.split("%%CB"+i+"%%").join(c); });
  return out;
}

function addMsg(role, html){
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "ai");
  d.innerHTML = html; chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight; return d;
}
function addErr(t, retryFn){
  const d = document.createElement("div"); d.className = "msg err";
  d.textContent = t;
  if(retryFn){
    const b = document.createElement("button");
    b.textContent = "Retry"; b.className = "iconbtn"; b.style.marginTop = "8px";
    b.onclick = () => { d.remove(); retryFn(); };
    d.appendChild(document.createElement("br")); d.appendChild(b);
  }
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
}

input.addEventListener("input", ()=>{
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
});
input.addEventListener("keydown", e=>{
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); doSend(false); }
});
send.onclick = () => doSend(false);

async function apiGet(path, key, signal){
  const res = await fetch(BASE + path, {
    headers: { "Authorization": "Bearer " + (key || getKey()) },
    signal: signal
  });
  if(!res.ok){
    let msg = "server error " + res.status;
    try{ const j = await res.json(); if(j.error) msg = (j.error.message || j.error.code || msg); }catch(e){}
    throw new Error(msg);
  }
  return res.json();
}
async function apiChat(payload, onToken, signal){
  const res = await fetch(BASE + "/chat/completions", {
    method: "POST",
    headers: { "Authorization": "Bearer " + getKey(), "Content-Type": "application/json" },
    body: JSON.stringify(payload),
    signal: signal
  });
  if(!res.ok){
    let msg = "server error " + res.status;
    try{ const j = await res.json(); if(j.error) msg = (j.error.message || j.error.code || msg); }catch(e){}
    throw new Error(msg);
  }
  if(payload.stream && res.body){
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "", text = "";
    for(;;){
      const {done, value} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      let idx;
      while((idx = buf.indexOf("\n")) >= 0){
        const line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 1);
        if(line.indexOf("data:") !== 0) continue;
        const data = line.slice(5).trim();
        if(data === "[DONE]") continue;
        try{
          const j = JSON.parse(data);
          const t = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
          if(t){ text += t; onToken(text); }
        }catch(e){}
      }
    }
    return text;
  }
  const j = await res.json();
  return (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || "";
}

async function wakeServer(){
  if(serverReady || !getKey()) return;
  setStatus("Waking up the server — free tier sleeps, this can take up to a minute…", "busy");
  const t0 = Date.now();
  const tick = setInterval(()=>{
    const s = Math.round((Date.now() - t0) / 1000);
    setStatus("Waking up the server… " + s + "s", "busy");
  }, 1000);
  try{
    await apiGet("/models");
    serverReady = true;
    setStatus("Server ready ✓", "ok");
    setTimeout(()=>{ if(!busy) setStatus(""); }, 3000);
  }catch(e){
    setStatus("Server didn't answer (" + e.message + ") — your first message will retry.", "err");
  }
  clearInterval(tick);
}

async function doSend(isRetry){
  if(busy || !getKey()) return;
  const text = (isRetry ? lastUser : input.value).trim();
  if(!text) return;
  busy = true; send.disabled = true;
  if(!isRetry){
    addMsg("user", esc(text));
    lastUser = text;
    input.value = ""; input.style.height = "auto";
  }
  history.push({role:"user", content:text});
  const ai = addMsg("ai", '<span class="typing"><i></i><i></i><i></i></span>');
  chat.scrollTop = chat.scrollHeight;

  const ctrl = new AbortController();
  const t0 = Date.now();
  const tick = setInterval(()=>{
    const s = Math.round((Date.now() - t0) / 1000);
    setStatus(serverReady ? ("Thinking… " + s + "s") : ("Waking up the server… " + s + "s"), "busy");
  }, 1000);
  const timeout = setTimeout(()=>ctrl.abort(), 120000);

  try{
    const payload = { model: modelSel.value, messages: history.slice(-20), stream: true, max_tokens: 2000 };
    let full = "";
    try{
      full = await apiChat(payload, t => {
        ai.innerHTML = md(t); chat.scrollTop = chat.scrollHeight;
      }, ctrl.signal);
    }catch(e){
      if(e && e.name === "AbortError") throw new Error("timed out after 2 minutes");
      payload.stream = false;
      full = await apiChat(payload, null, ctrl.signal);
    }
    if(!full.trim()){
      const p2 = { model: modelSel.value, messages: history.slice(-20), stream: false, max_tokens: 2000 };
      full = await apiChat(p2, null, ctrl.signal);
    }
    if(!full.trim()) throw new Error("empty reply from server");
    serverReady = true;
    ai.innerHTML = md(full);
    history.push({role:"assistant", content:full});
    setStatus("");
  }catch(e){
    ai.remove(); history.pop();
    setStatus("Something went wrong.", "err");
    addErr("⚠️ " + (e.message || "request failed") +
      (serverReady ? "" : " (The free server may have been asleep — wait a few seconds and retry.)"),
      ()=>doSend(true));
  }
  clearInterval(tick); clearTimeout(timeout);
  chat.scrollTop = chat.scrollHeight;
  busy = false; send.disabled = !getKey(); input.focus();
}

refreshKeyUI();
if(getKey()){ keystate.textContent = "API key saved on this device"; wakeServer(); }
})();
</script>
</body>
</html>
